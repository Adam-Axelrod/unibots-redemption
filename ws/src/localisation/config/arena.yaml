
# ws/src/localisation/config/arena.yaml

# The map is centred on the arena, with the forward axis pointing inwards from our starting wall.
frame:
  frame_id: map
  # Forward axis x or y
  forward_axis: y
  # Forward sign +1 or -1
  forward_sign: +1

walls:
  inner_side_length_m: 2.500
  inner_side_length_tolerance_m: 0.050
  height_m: 0.157
  height_tolerance_m: 0.010

# The scoring guides define the valid starting and parking span along our home wall.
scoring_guides:
  width_m: 0.020
  inner_edge_separation_m: 0.760
  position_tolerance_m: 0.002
